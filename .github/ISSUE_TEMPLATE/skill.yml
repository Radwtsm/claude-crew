name: Proponi una skill
description: Un tipo di lavoro che Claude dovrebbe saper fare meglio
labels: [skill]
body:
  - type: input
    id: tema
    attributes:
      label: Di cosa si tratta?
      placeholder: es. mod Fabric, montaggio con CapCut, loghi
    validations:
      required: true
  - type: textarea
    id: cosa
    attributes:
      label: Cosa dovrebbe sapere o fare Claude?
      description: Consigli, passi, errori da evitare, programmi che usi. Niente password o dati personali.
    validations:
      required: true
