name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh check.sh
      - name: elenco dei plugin aggiornato
        run: python3 tools/elenco.py && git diff --exit-code .claude-plugin/marketplace.json
